<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Management - Smart Library</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body>
    <div class="toggle-btn" onclick="toggleSidebar()">☰</div>

    <div class="sidebar" id="sidebar">
        <div class="logo-section">
         <div class="logo">LM</div>
            <div class="logo-text">Library</div>
            <div class="logo-subtitle">Management</div>
        </div>

        <nav class="nav-menu">
            <a href="../index.html" class="menu-item">
                <span class="menu-icon">🏠</span>
                <span class="menu-text">Dashboard</span>
            </a>
            <a href="book.html" class="menu-item active">
                <span class="menu-icon">📚</span>
                <span class="menu-text">Books</span>
            </a>
            <a href="user.html" class="menu-item">
                <span class="menu-icon">👥</span>
                <span class="menu-text">Users</span>
            </a>
            <a href="loans.html" class="menu-item">
                <span class="menu-icon">📖</span>
                <span class="menu-text">Loans</span>
            </a>
            <a href="fines.html" class="menu-item">
                <span class="menu-icon">💰</span>
                <span class="menu-text">Fines</span>
            </a>
        </nav>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Books Management</h1>
            <p>Manage your library's book collection</p>
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" onclick="showAddBookModal()">➕ Add New Book</button>
            <input type="text" id="searchInput" placeholder="Search books..." 
                   style="padding:12px;border:2px solid #e0e0e0;border-radius:8px;flex:1;max-width:300px;"
                   onkeyup="searchBooks()">
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ISBN</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Publisher</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Copies</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="booksTable">
                    <tr><td colspan="8" style="text-align:center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Book Modal -->
    <div id="bookModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Book</h2>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <form id="bookForm" onsubmit="saveBook(event)">
                <div class="form-group">
                    <label>ISBN *</label>
                    <input type="text" name="isbn" required>
                </div>
                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" name="title" required>
                </div>
                <div class="form-group">
                    <label>Author *</label>
                    <input type="text" name="author" required>
                </div>
                <div class="form-group">
                    <label>Publisher</label>
                    <input type="text" name="publisher">
                </div>
                <div class="form-group">
                    <label>Publication Year</label>
                    <input type="number" name="publicationYear" min="1900" max="2100">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" name="category" value="General">
                </div>
                <div class="form-group">
                    <label>Price *</label>
                    <input type="number" name="price" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Total Copies *</label>
                    <input type="number" name="totalCopies" min="1" required>
                </div>
                <div class="form-group">
                    <label>Available Copies *</label>
                    <input type="number" name="availableCopies" min="0" required>
                </div>
                <div class="action-buttons">
                    <button type="submit" class="btn btn-primary">Save Book</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>    
    <script src="../js/ui.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
